
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Solução | Analista</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="flex items-center justify-center">
  <div class="card card-md">
    <div style="display:flex;align-items:center;gap:.75rem;margin-bottom:1.75rem">
      <div class="menu-icon menu-icon-t" style="flex-shrink:0">✏️</div>
      <div>
        <h1 class="text-2xl font-bold text-primary">Editar Solução</h1>
        <p class="text-muted" style="font-size:.8rem;margin-top:.15rem">Atualize as informações desta solução</p>
      </div>
    </div>
    <div class="space-y-4">
      <input type="hidden" id="id_solucao" name="id_solucao">
      <div class="form-group">
        <label for="titulo" class="form-label">Título da Solução</label>
        <input type="text" id="titulo" name="titulo" class="form-input" required>
      </div>
      <div class="form-group">
        <label for="equipe" class="form-label">Equipe Alvo</label>
        <input type="text" id="equipe" name="equipe" class="form-input" required>
      </div>
      <div class="form-group">
        <label for="descricao" class="form-label">Descrição</label>
        <textarea id="descricao" name="descricao" class="form-input" rows="4" required></textarea>
      </div>
      <div style="display:flex;gap:.6rem;margin-top:1.5rem">
        <button type="button" onclick="window.history.back()" class="btn btn-secondary" style="width:auto;padding:.7rem 1.1rem">← Voltar</button>
        <button id="salvar" class="btn btn-primary flex-1">Salvar Alterações</button>
      </div>
    </div>
  </div>
  <script src="../js/solucao_alterar.js"></script>
</body>
</html>
