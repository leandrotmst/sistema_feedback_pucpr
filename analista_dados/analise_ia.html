
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de IA | Analista</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container">
    <div class="card card-lg" style="min-height:500px">
      <div class="header-gerenciamento">
        <div>
          <h1>Inteligência Artificial</h1>
          <p class="text-muted" style="font-size:.83rem;margin-top:.3rem">Análise semanal das respostas da equipe (últimos 7 dias)</p>
        </div>
        <div class="flex gap-2">
          <button type="button" onclick="window.location.href='index.html'" class="btn btn-secondary btn-auto">← Voltar</button>
          <button id="btnGerarAnalise" class="btn btn-ai btn-auto">Gerar Análise</button>
        </div>
      </div>

      <div id="loading" style="display:none;text-align:center;padding:4rem 0">
        <div style="font-size:2.5rem;animation:pulse 1.5s infinite;display:block;margin-bottom:1rem">⏳</div>
        <h3 style="font-family:'Syne',sans-serif;font-weight:800;color:#131340;margin-bottom:.4rem">Analisando os dados...</h3>
        <p class="text-muted" style="font-size:.85rem">Isso pode levar alguns segundos.</p>
      </div>

      <div id="resultadoIA" style="display:none;flex-direction:column;gap:.75rem">
        <div class="ia-card ia-card-summary">
          <div class="ia-card-title">Resumo do Clima Semanal</div>
          <p id="resumo" style="white-space:pre-line;font-size:.9rem;line-height:1.7;color:#4a4080"></p>
        </div>
        <div class="ia-card ia-card-alerts">
          <div class="ia-card-title">Alertas de Atenção</div>
          <p id="alertas" style="white-space:pre-line;font-size:.9rem;line-height:1.7;color:#7f1d1d"></p>
        </div>
        <div class="ia-card ia-card-solutions">
          <div class="ia-card-title">Soluções Propostas pela IA</div>
          <p id="solucoes" style="white-space:pre-line;font-size:.9rem;line-height:1.7;color:#134e4a"></p>
        </div>
      </div>

      <div id="msgErro" style="display:none;margin-top:2rem;color:var(--c-red);text-align:center;font-weight:700"></div>
    </div>
  </div>
  <script src="../js/analise_ia.js"></script>
  <script src="../js/analista_dados_valida_sessao.js"></script>
</body>
</html>
