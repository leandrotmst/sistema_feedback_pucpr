
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novo Gestor | Admin</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="flex items-center justify-center p-4">
  <div class="card card-md">

    <div style="display:flex;align-items:center;gap:.75rem;margin-bottom:1.75rem">
      <div class="menu-icon menu-icon-p" style="flex-shrink:0">👔</div>
      <div>
        <h1 class="text-2xl font-bold text-primary">Cadastrar Gestor</h1>
        <p class="text-muted" style="font-size:.8rem;margin-top:.15rem">Preencha os dados para criar um novo acesso de gestor</p>
      </div>
    </div>

    <div class="space-y-4">
      <div class="form-group">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" id="email" name="email" class="form-input" placeholder="gestor@email.com" required>
      </div>

      <div class="form-group">
        <label for="senha" class="form-label">Senha</label>
        <div class="pw-wrap">
          <input type="password" id="senha" name="senha" class="form-input" placeholder="••••••••" required>
          <button type="button" class="btn-eye" onclick="togglePw('senha',this)" tabindex="-1">👁</button>
        </div>
      </div>
      
      <div style="display:flex;gap:.6rem;margin-top:1.5rem">
        <button type="button" onclick="window.location.href='index.html'" class="btn btn-secondary" style="width:auto;padding:.7rem 1.1rem">← Voltar</button>
        <button type="button" id="enviar" class="btn btn-primary flex-1">Cadastrar Gestor</button>
      </div>
      
    </div>

  </div>

  <script>function togglePw(id,btn){const el=document.getElementById(id);el.type=el.type==='password'?'text':'password';btn.textContent=el.type==='password'?'👁':'🙈';}</script>
  <script src="../js/admin_valida_sessao.js"></script>
  <script src="../js/gestor_novo.js"></script>
</body>
</html>
