<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrador | AlignUp</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="lp-right">
        <div class="lp-role-badge role-gestor">
            <span class="lp-role-dot"></span> Área do Administrador
        </div>
        <h2 class="lp-form-title">Acesso de Administrador</h2>
        <p class="lp-form-sub">Gerencie gestores</p>

        <div class="lp-form-card">
            <div class="form-group" style="margin-bottom:.9rem">
                <label for="usuario" class="form-label">Usuário</label>
                <input type="text" id="usuario" name="usuario" required class="form-input" placeholder="admin" autocomplete="username">
            </div>
            <div class="form-group" style="margin-bottom:1.25rem">
                <label for="senha" class="form-label">Senha</label>
            <div class="pw-wrap">
                <input type="password" id="senha" name="senha" required class="form-input" placeholder="••••••••" autocomplete="current-password">
                <button type="button" class="btn-eye" onclick="togglePw('senha',this)" tabindex="-1">👁</button>
            </div>
        </div>
            <div style="display:flex;gap:.6rem">
                <button id="login" type="button" class="btn btn-primary flex-1">Entrar</button>
            </div>
        </div>
    </div>
    <script src="js/admin_login.js"></script>
</body>


</html>
