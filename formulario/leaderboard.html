<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard | AlignUp</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="flex items-center justify-center p-4">
  <div class="card card-md" style="max-width:900px; width:100%;">
    <div style="text-align:center; margin-bottom:1.25rem;">
        <h1 class="text-2xl font-bold text-primary">Quadro de Pontuação</h1>
        <p class="text-muted" style="font-size:.88rem;margin-top:.3rem">Veja quem está respondendo semanalmente e subindo no ranking.</p>
    </div>

    <div style="margin-bottom:1rem;color:#334155;font-size:1rem;line-height:1.6;">
      Responda o formulário semanalmente para ganhar pontos. 
    </div>

    <div id="leaderboard"></div>

    <div style="display:flex; justify-content: space-between; gap:.75rem; margin-top:1.5rem; flex-wrap:wrap;">
      <button onclick="window.history.back()" class="btn btn-secondary btn-auto">← Voltar</button>
      <button onclick="window.location.href='../index.html'" class="btn btn-primary btn-auto">Ir para o portal</button>
    </div>
  </div>
  <script src="../js/leaderboard.js"></script>
</body>
</html>
