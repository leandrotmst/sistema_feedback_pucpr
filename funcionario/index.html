
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Funcionário | AlignUp</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="flex items-center justify-center p-4">
  <div class="card card-sm">
    <div style="text-align:center;margin-bottom:2rem">
      <div style="width:56px;height:56px;border-radius:16px;background: hsl(240, 53%, 31%);display:flex;align-items:center;justify-content:center;font-size:1.5rem;margin:0 auto .75rem">👤</div>
      <h1 style="font-family:'Syne',sans-serif;font-size:1.35rem;font-weight:800;letter-spacing:-.04em;color:#131340">Portal do Funcionário</h1>
      <p class="text-muted" style="font-size:.82rem;margin-top:.3rem">O que você deseja fazer hoje?</p>
    </div>
    <div class="menu-list">
      <a href="../formulario/resposta_nova.html" class="menu-item">
        <span>Nova Resposta Semanal</span>
        <span class="menu-arrow">›</span>
      </a>
      <a href="../formulario/respostas.html" class="menu-item">
        <span>Minhas Respostas</span>
        <span class="menu-arrow">›</span>
      </a>
      <a href="../formulario/leaderboard.html" class="menu-item">
        <span>Quadro de Pontuação </span>
        <span class="menu-arrow">›</span>
      </a>
    </div>
    <div id="score-banner" style="text-align:center;margin-top:1.25rem;padding:.9rem 1rem;background: hsl(240, 53%, 31%);border-radius:18px;color:#fff;font-weight:700;">
      🔥 Sua pontuação atual: <span id="score-value">0</span>
      <div style="font-size:.88rem;font-weight:400;margin-top:.35rem;color:rgba(255,255,255,.9)">Complete o formulário semanal para subir no ranking.</div>
    </div>
    <button onclick="logout()" class="btn btn-danger mt-6">Sair da Conta</button>
  </div>
  <script src="../js/index_funcionario.js"></script>
  <script src="../js/funcionario_valida_sessao.js"></script>
</body>
</html>
